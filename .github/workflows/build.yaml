# ============================================================
# FlClash 自用极简构建 Workflow
#
# 设计目标：
# 1. 只保留“真正生成安装包”需要的步骤，不跑官方完整 CI 测试矩阵。
# 2. 仅手动触发；同步上游代码后，由自己点击 Run workflow 构建。
# 3. 只构建：
#    - macOS ARM64（Apple Silicon）
#    - Android arm64-v8a
# 4. 尽量只修改 Flutter / Dart 上层，不改 Go Core。
#
# 自用功能改动：
# - UI 手动延迟测试超时：1 秒
# - UI 批量延迟测试并发：40
#   （Go Core 官方上限 50 不动，预留 10 个槽位 / 20% 余量）
# - 全局测速链接：https://chatgpt.com/cdn-cgi/trace
# - 关闭 FlClash 自身“自动检查更新”
#   （不影响机场/订阅更新）
# - 关闭 unified-delay（统一延迟）
# - 对已经存在的旧本地设置也强制应用以上三个配置，
#   覆盖安装后无需再次手动修改
#
# 为了加速，本 Workflow 刻意移除了官方 CI 中的：
# Dart / Plugin / Desktop Debug / Go / Android Unit / Rust /
# Windows Helper 等前置检查。
# 这些是上游开发质量检查，不是生成自用安装包的必要步骤。
# 真正编译失败时，下面的正式 Build 仍然会直接报错。
# ============================================================

name: build

on:
  workflow_dispatch:

# 如果误点多次，只保留最新一次构建，避免浪费 Actions 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

  # 【自用设置】Android 签名直接内嵌，避免额外维护 GitHub Secrets。
  ANDROID_KEY_ALIAS: 'flclash'
  ANDROID_STORE_PASSWORD: 'flclash123456'
  ANDROID_KEY_PASSWORD: 'flclash123456'
  ANDROID_KEYSTORE_BASE64: >-
    

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Android 构建失败时仍让 macOS 继续，反之亦然。
      fail-fast: false
      matrix:
        include:
          # Android 仅构建现代 64 位 ARM 设备使用的 arm64-v8a。
          - platform: android
            os: ubuntu-latest
            arch: arm64

          # macOS 仅构建 Apple Silicon。
          - platform: macos
            os: macos-latest
            arch: arm64

    steps:
      # ----------------------------------------------------------
      # 1. 拉取源码与 submodule
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ----------------------------------------------------------
      # 2. 编译前临时应用本 Fork 的 Flutter / Dart 层定制
      #
      # 不直接提交这些业务源码修改，目的是让 Fork 尽量贴近上游；
      # 每次 Actions 构建时再临时 patch。
      #
      # replace_once 匹配不到时会主动失败，表示官方代码结构可能变化，
      # 防止出现“构建成功，但自定义实际上没有生效”的情况。
      # ----------------------------------------------------------
      - name: 应用 Flutter 层自用设置
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TEST_URL = "https://chatgpt.com/cdn-cgi/trace"

          def replace_once(file, pattern, replacement, label):
              path = Path(file)
              source = path.read_text()
              new_source, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise SystemExit(
                      f"上游代码可能已经变化：无法在 {file} 中修改【{label}】"
                  )
              path.write_text(new_source)

          # ① UI 手动延迟测试：1 秒未完成就超时。
          replace_once(
              "lib/common/constant.dart",
              r"const delayTestTimeoutDuration = Duration\(seconds: \d+\);",
              "const delayTestTimeoutDuration = Duration(seconds: 1);",
              "延迟测试超时改为 1 秒",
          )

          # ② UI 批量测速并发：40。
          #    Go Core 的官方并发上限保持 50，不修改 Core。
          replace_once(
              "lib/common/constant.dart",
              r"const maxConcurrentDelayTests = \d+;",
              "const maxConcurrentDelayTests = 40;",
              "UI 延迟测试并发改为 40",
          )

          # ③ Flutter 层默认测速地址。
          replace_once(
              "lib/common/constant.dart",
              r"const defaultTestUrl = '[^']+';",
              f"const defaultTestUrl = '{TEST_URL}';",
              "Flutter 默认测试 URL",
          )

          # ④ FlClash 自身自动检查 App 更新：默认关闭。
          #    这里只关闭 App 更新检查，不影响机场/订阅更新。
          replace_once(
              "lib/models/config.dart",
              r"@Default\(true\)\s+bool autoCheckUpdate,",
              "@Default(false) bool autoCheckUpdate,",
              "自动检查 App 更新默认关闭",
          )
          replace_once(
              "lib/models/generated/config.freezed.dart",
              r"this\.autoCheckUpdate = true",
              "this.autoCheckUpdate = false",
              "自动检查 App 更新生成代码默认值",
          )

          # ⑤ 覆盖安装时也忽略旧本地配置：
          #    强制使用新的测速 URL，并保持 App 自动更新关闭。
          replace_once(
              "lib/models/generated/config.g.dart",
              r"testUrl: json\['testUrl'\] as String\? \?\? defaultTestUrl,",
              "testUrl: defaultTestUrl,",
              "忽略旧配置中的测试 URL",
          )
          replace_once(
              "lib/models/generated/config.g.dart",
              r"autoCheckUpdate: json\['autoCheckUpdate'\] as bool\? \?\? true,",
              "autoCheckUpdate: false,",
              "忽略旧配置中的自动更新开关",
          )

          # ⑥ unified-delay（统一延迟）：默认关闭。
          #    目标是让延迟测试更符合“一次请求、快速筛选”的场景。
          replace_once(
              "lib/models/clash_config.dart",
              r"@Default\(true\)\s+@JsonKey\(name: 'unified-delay'\)\s+bool unifiedDelay,",
              "@Default(false) @JsonKey(name: 'unified-delay') bool unifiedDelay,",
              "统一延迟默认关闭",
          )
          replace_once(
              "lib/models/generated/clash_config.freezed.dart",
              r"this\.unifiedDelay = true",
              "this.unifiedDelay = false",
              "统一延迟生成代码默认值",
          )

          # 同样忽略旧本地配置里已经保存的 unified-delay=true。
          replace_once(
              "lib/models/generated/clash_config.g.dart",
              r"unifiedDelay: json\['unified-delay'\] as bool\? \?\? true,",
              "unifiedDelay: false,",
              "忽略旧配置中的统一延迟开关",
          )

          print("已应用自用设置：")
          print("  UI 延迟测试超时 = 1 秒")
          print("  UI 测速并发     = 40")
          print(f"  测速 URL        = {TEST_URL}")
          print("  App 自动更新    = 关闭")
          print("  unified-delay   = 关闭")
          print("  Go Core         = 官方原样")
          PY

      # ----------------------------------------------------------
      # 3. Android 签名
      # 仅 Android 执行；macOS 跳过。
      # ----------------------------------------------------------
      - name: 配置 Android 签名
        if: matrix.platform == 'android'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } >> android/local.properties

      # ----------------------------------------------------------
      # 4. Go
      # setup.dart 构建 FlClash Core 时需要。
      # setup-go 自带模块缓存，可明显减少后续构建耗时。
      # ----------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # ----------------------------------------------------------
      # 5. Rust 编译缓存
      # 不是测试步骤；用于加速原生 helper / plugin 的重复构建。
      # ----------------------------------------------------------
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      # ----------------------------------------------------------
      # 6. Android Gradle 缓存
      # ----------------------------------------------------------
      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      # ----------------------------------------------------------
      # 7. Flutter
      # 跟随官方构建所使用的固定版本，并启用 SDK 缓存。
      # ----------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ----------------------------------------------------------
      # 8. macOS 选择官方使用的 Xcode 版本
      # ----------------------------------------------------------
      - name: Setup Xcode
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app ||           sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      # ----------------------------------------------------------
      # 9. Android NDK
      # 构建 Android arm64 的 Go/CGo Core 需要。
      # ----------------------------------------------------------
      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      # ----------------------------------------------------------
      # 10. Flutter / Dart 依赖
      # ----------------------------------------------------------
      - name: 获取 Flutter 依赖
        shell: bash
        run: |
          flutter --version
          flutter pub get

      # ----------------------------------------------------------
      # 11. 正式构建
      #
      # Android 明确指定 --arch arm64，因此只生成 arm64-v8a；
      # macOS matrix 只有 arm64，因此只生成 Apple Silicon 包。
      # 使用 --env stable，与官方正式版本的构建环境保持一致。
      # ----------------------------------------------------------
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            dart setup.dart android --arch arm64 --env stable -v
          else
            dart setup.dart macos --env stable -v
          fi

      # ----------------------------------------------------------
      # 12. 上传最终安装包
      #
      # 不做 Telegram / GitHub Release / Homebrew / F-Droid 发布；
      # 构建完成后直接在当前 Actions Run 的 Artifacts 下载即可。
      # ----------------------------------------------------------
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./dist
          overwrite: true
