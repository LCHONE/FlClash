name: build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

  # 【自用设置】Android 签名直接内嵌，避免额外维护 GitHub Secrets。
  ANDROID_KEY_ALIAS: 'flclash'
  ANDROID_STORE_PASSWORD: 'flclash123456'
  ANDROID_KEY_PASSWORD: 'flclash123456'
  ANDROID_KEYSTORE_BASE64: >-
    

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: android
          os: ubuntu-latest
          arch: arm64
        - platform: macos
          os: macos-latest
          arch: arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: 应用 Flutter 层自用源码修改
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import json


        def replace(path, old, new):
            file = Path(path)
            source = file.read_text()
            if source.count(old) != 1:
                raise SystemExit(f'Upstream changed: expected one target in {path}: {old[:90]}')
            file.write_text(source.replace(old, new, 1))


        replace('lib/common/constant.dart', 'const defaultDelayTestTimeout = 8000;',
                'const defaultDelayTestTimeout = 500;')
        replace('lib/common/constant.dart', 'const maxConcurrentDelayTests = 32;',
                'const maxConcurrentDelayTests = 40;')
        source = Path('lib/common/constant.dart').read_text()
        import re
        match = re.search(r"const defaultTestUrl = '[^']+';", source)
        if match is None:
            raise SystemExit('Upstream changed: defaultTestUrl')
        replace('lib/common/constant.dart', match.group(),
                "const defaultTestUrl = 'https://chatgpt.com/cdn-cgi/trace';")

        replace('lib/models/config.dart', '@freezed\nabstract class AppSettingProps', '''Object? _readPersonalTimeout(Map<dynamic, dynamic> json, String key) {
          final value = json[key] ?? json['delayTestTimeoutMs'];
          return value is int && value > 0 ? value : defaultDelayTestTimeout;
        }

        Object? _readPersonalConcurrency(Map<dynamic, dynamic> json, String key) {
          final value = json[key];
          return value is int ? value.clamp(1, 50).toInt() : maxConcurrentDelayTests;
        }

        Object? _readPersonalAutoCheckUpdate(Map<dynamic, dynamic> json, String key) => false;

        @freezed
        abstract class AppSettingProps''')
        replace('lib/models/config.dart',
                '@Default(defaultDelayTestTimeout) int delayTestTimeout,', '''@Default(defaultDelayTestTimeout)
            @JsonKey(readValue: _readPersonalTimeout)
            int delayTestTimeout,
            @Default(maxConcurrentDelayTests)
            @JsonKey(readValue: _readPersonalConcurrency)
            int delayTestConcurrency,''')
        replace('lib/models/config.dart', '@Default(true) bool autoCheckUpdate,',
                '@Default(false) @JsonKey(readValue: _readPersonalAutoCheckUpdate) bool autoCheckUpdate,')

        replace('lib/models/clash_config.dart', '@freezed\nabstract class PatchClashConfig', '''Object? _readPersonalTestUrl(Map<dynamic, dynamic> json, String key) => defaultTestUrl;

        Object? _readPersonalUnifiedDelay(Map<dynamic, dynamic> json, String key) => false;

        Object? _readPersonalGeneralKeys(Map<dynamic, dynamic> json, String key) => [
          ...?json[key] as List?,
          GeneralOverrideKey.testUrl.path,
          GeneralOverrideKey.unifiedDelay.path,
        ];

        @freezed
        abstract class PatchClashConfig''')
        replace('lib/models/clash_config.dart',
                "@Default(true) @JsonKey(name: 'unified-delay') bool unifiedDelay,",
                "@Default(false) @JsonKey(name: 'unified-delay', readValue: _readPersonalUnifiedDelay) bool unifiedDelay,")
        replace('lib/models/clash_config.dart',
                "@Default(defaultTestUrl) @JsonKey(name: 'test-url') String testUrl,",
                "@Default(defaultTestUrl) @JsonKey(name: 'test-url', readValue: _readPersonalTestUrl) String testUrl,")
        replace('lib/models/clash_config.dart', '''@Default({})
            @JsonKey(
              name: _generalOverrideKeysJsonKey,
              fromJson: _generalOverrideKeysFromJson,
            )''', '''@Default({GeneralOverrideKey.testUrl, GeneralOverrideKey.unifiedDelay})
            @JsonKey(
              name: _generalOverrideKeysJsonKey,
              readValue: _readPersonalGeneralKeys,
              fromJson: _generalOverrideKeysFromJson,
            )''')

        replace('lib/core/interface.dart', 'timeout: delayTestGuardDuration,',
                'timeout: coreGuardFor(timeout.inMilliseconds),')
        replace('lib/providers/actions/proxies.dart',
                '    final pending = ref.read(pendingDelayTestsProvider.notifier);',
                '''    _delayTestPool.concurrency = ref.read(appSettingProvider).delayTestConcurrency;
            final pending = ref.read(pendingDelayTestsProvider.notifier);''')

        replace('lib/common/task_pool.dart',
                '  TaskPool(this.concurrency) : assert(concurrency > 0);\n\n  final int concurrency;',
                '''  TaskPool(int concurrency) : assert(concurrency > 0), _concurrency = concurrency;

          int _concurrency;

          int get concurrency => _concurrency;

          set concurrency(int value) {
            if (value <= 0) {
              throw ArgumentError.value(value, 'concurrency');
            }
            _concurrency = value;
            _drain();
          }

          void _drain() {
            while (_active < concurrency && _waiting.isNotEmpty) {
              _active++;
              _waiting.removeFirst().complete();
            }
          }''')
        replace('lib/common/task_pool.dart',
                'int get idleSlots => _waiting.isEmpty ? concurrency - _active : 0;',
                'int get idleSlots => _waiting.isEmpty ? (concurrency - _active).clamp(0, concurrency).toInt() : 0;')
        replace('lib/common/task_pool.dart', '''      if (_waiting.isNotEmpty) {
                _waiting.removeFirst().complete();
              } else {
                _active--;
              }''', '''      _active--;
              _drain();''')

        replace('lib/views/config/general.dart', '''    return ConfigOptionsItem<int>(
              title: (l) => l.delayTestTimeout,
              options: delayTestTimeoutOptions,
              textBuilder: (value) => '$value ms',
              selector: appSettingProvider.select((state) => state.delayTestTimeout),
              onChanged: (ref, value) => ref
                  .read(appSettingProvider.notifier)
                  .update((state) => state.copyWith(delayTestTimeout: value)),
            );''', '''    final l = context.appLocalizations;
            final timeout = ref.watch(appSettingProvider.select((state) => state.delayTestTimeout));
            return ListItem.input(
              title: Text(l.delayTestTimeout),
              subtitle: Text('$timeout ms'),
              dialogTitle: l.delayTestTimeout,
              suffixText: 'ms',
              resetValue: '500',
              value: '$timeout',
              keyboardType: TextInputType.number,
              validator: (value) => int.tryParse(value ?? '') case final int number when number > 0
                  ? null : l.personalPositiveInteger,
              onChanged: (value) {
                if (value == null) return;
                ref.read(appSettingProvider.notifier).update(
                  (state) => state.copyWith(delayTestTimeout: int.parse(value)),
                );
              },
            );'''.replace("validator: (value) => int.tryParse(value ?? '') case final int number when number > 0\n          ? null : l.personalPositiveInteger,", "validator: (value) {\n        final number = int.tryParse(value ?? '');\n        return number != null && number > 0 ? null : l.personalPositiveInteger;\n      },"))
        replace('lib/views/config/general.dart', 'class PortItem extends ConsumerWidget {', '''class DelayTestConcurrencyItem extends ConsumerWidget {
          const DelayTestConcurrencyItem({super.key});

          @override
          Widget build(BuildContext context, WidgetRef ref) {
            final l = context.appLocalizations;
            final concurrency = ref.watch(appSettingProvider.select((state) => state.delayTestConcurrency));
            return ListItem.input(
              title: Text(l.personalDelayTestConcurrency),
              subtitle: Text('$concurrency'),
              dialogTitle: l.personalDelayTestConcurrency,
              resetValue: '40',
              value: '$concurrency',
              maxLength: 2,
              keyboardType: TextInputType.number,
              validator: (value) {
                final number = int.tryParse(value ?? '');
                return number != null && number >= 1 && number <= 50
                    ? null : l.numberRangeTip(l.personalDelayTestConcurrency, 1, 50);
              },
              onChanged: (value) {
                if (value == null) return;
                ref.read(appSettingProvider.notifier).update(
                  (state) => state.copyWith(delayTestConcurrency: int.parse(value)),
                );
              },
            );
          }
        }

        class PortItem extends ConsumerWidget {''')
        replace('lib/views/config/general.dart', '      const DelayTestTimeoutItem(),',
                '      const DelayTestTimeoutItem(),\n      const DelayTestConcurrencyItem(),')

        translations = {
            'en': ('Delay test concurrency', 'Enter an integer greater than 0'),
            'zh_CN': ('测速并发', '请输入大于 0 的整数'),
            'ja': ('遅延テストの同時実行数', '0 より大きい整数を入力してください'),
            'ru': ('Параллельные тесты задержки', 'Введите целое число больше 0'),
            'fr': ('Tests de latence simultanés', 'Saisissez un entier supérieur à 0'),
            'es': ('Pruebas de latencia simultáneas', 'Introduce un entero mayor que 0'),
            'ko': ('지연 시간 테스트 동시 실행 수', '0보다 큰 정수를 입력하세요'),
        }
        for locale, (concurrency, positive) in translations.items():
            file = Path(f'arb/intl_{locale}.arb')
            data = json.loads(file.read_text())
            data.update(personalDelayTestConcurrency=concurrency, personalPositiveInteger=positive)
            file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

        print('Personal v0.9.2 patch applied; Go sources and generated files unchanged.')

        Path('test/personal_build_test.dart').write_text(r'''import 'dart:async';
        import 'dart:convert';

        import 'package:fl_clash/common/common.dart';
        import 'package:fl_clash/enum/enum.dart';
        import 'package:fl_clash/models/models.dart';
        import 'package:fl_clash/providers/config.dart';
        import 'package:fl_clash/state.dart';
        import 'package:fl_clash/ui/list.dart';
        import 'package:fl_clash/views/config/general.dart';
        import 'package:flutter_riverpod/flutter_riverpod.dart';
        import 'package:flutter_test/flutter_test.dart';
        import 'package:material_ui/material_ui.dart';

        import 'helpers/test_app.dart';

        void main() {
          test('personal defaults apply on a fresh install', () {
            const settings = AppSettingProps();
            const clash = PatchClashConfig();
            expect(settings.delayTestTimeout, 500);
            expect(settings.delayTestConcurrency, 40);
            expect(settings.autoCheckUpdate, isFalse);
            expect(clash.testUrl, 'https://chatgpt.com/cdn-cgi/trace');
            expect(clash.unifiedDelay, isFalse);
            expect(clash.generalOverrideKeys, containsAll([
              GeneralOverrideKey.testUrl,
              GeneralOverrideKey.unifiedDelay,
            ]));
            expect(clash.toUpdateParams(authentication: [], skipCertVerify: false).unifiedDelay, isFalse);
          });

          test('old custom timeout and concurrency survive an upgrade', () {
            final settings = AppSettingProps.fromJson({
              'delayTestTimeoutMs': 12345,
              'delayTestConcurrency': 17,
              'autoCheckUpdate': true,
            });
            expect(settings.delayTestTimeout, 12345);
            expect(settings.delayTestConcurrency, 17);
            expect(settings.autoCheckUpdate, isFalse);
            final restored = AppSettingProps.fromJson(
              jsonDecode(jsonEncode(settings.toJson())) as Map<String, Object?>,
            );
            expect(restored.delayTestTimeout, 12345);
            expect(restored.delayTestConcurrency, 17);
          });

          test('invalid persisted probe settings are normalized', () {
            expect(AppSettingProps.fromJson({'delayTestTimeout': 0}).delayTestTimeout, 500);
            expect(AppSettingProps.fromJson({'delayTestConcurrency': 99}).delayTestConcurrency, 50);
            expect(AppSettingProps.fromJson({'delayTestConcurrency': -1}).delayTestConcurrency, 1);
            expect(coreGuardFor(60000), const Duration(seconds: 125));
          });

          test('old and new override formats retain personal fixed settings', () {
            for (final keys in [null, <String>[], ['tcp-concurrent']]) {
              final clash = PatchClashConfig.fromJson({
                'test-url': 'https://example.com',
                'unified-delay': true,
                'general-override-keys': ?keys,
              });
              expect(clash.testUrl, defaultTestUrl);
              expect(clash.unifiedDelay, isFalse);
              expect(clash.generalOverrideKeys, containsAll([
                GeneralOverrideKey.testUrl,
                GeneralOverrideKey.unifiedDelay,
              ]));
              if (keys?.contains('tcp-concurrent') ?? false) {
                expect(clash.generalOverrideKeys, contains(GeneralOverrideKey.tcpConcurrent));
              }
            }
          });

          test('a shrinking pool holds queued work until capacity is available', () async {
            final pool = TaskPool(3);
            final gates = List.generate(5, (_) => Completer<void>());
            final started = <int>[];
            final runs = List.generate(5, (index) => pool.run(() async {
              started.add(index);
              await gates[index].future;
            }));
            expect(started, [0, 1, 2]);
            pool.concurrency = 1;
            expect(pool.idleSlots, 0);
            gates[0].complete();
            gates[1].complete();
            await Future<void>.delayed(Duration.zero);
            expect(started, [0, 1, 2]);
            gates[2].complete();
            await Future<void>.delayed(Duration.zero);
            expect(started, [0, 1, 2, 3]);
            gates[3].complete();
            await Future<void>.delayed(Duration.zero);
            gates[4].complete();
            await Future.wait(runs);
            expect(pool.activeCount, 0);
          });

          test('growing a pool immediately admits queued work', () async {
            final pool = TaskPool(1);
            final gate = Completer<void>();
            final started = <int>[];
            final runs = List.generate(3, (index) => pool.run(() async {
              started.add(index);
              await gate.future;
            }));
            expect(started, [0]);
            pool.concurrency = 3;
            await Future<void>.delayed(Duration.zero);
            expect(started, [0, 1, 2]);
            gate.complete();
            await Future.wait(runs);
            expect(pool.activeCount, 0);
            expect(() => pool.concurrency = 0, throwsArgumentError);
          });

          testWidgets('timeout accepts arbitrary positive integers', (tester) async {
            final container = ProviderContainer();
            globalState.container = container;
            addTearDown(container.dispose);
            final hold = container.listen(appSettingProvider, (_, _) {});
            addTearDown(hold.close);
            await tester.pumpWidget(UncontrolledProviderScope(
              container: container,
              child: const TestApp(child: Scaffold(body: DelayTestTimeoutItem())),
            ));
            await tester.pumpAndSettle();
            final item = tester.widget<ListItem>(find.byType(ListItem));
            expect(item.subtitle, isA<Text>().having((text) => text.data, 'text', '500 ms'));
            await tester.tap(find.text('500 ms'));
            await tester.pumpAndSettle();
            final field = tester.widget<TextFormField>(find.byType(TextFormField).first);
            expect(field.validator!('0'), isNotNull);
            expect(field.validator!('-2'), isNotNull);
            expect(field.validator!('1.5'), isNotNull);
            expect(field.validator!('60000'), isNull);
            await tester.enterText(find.byType(TextFormField).first, '60000');
            await tester.tap(find.text(currentAppLocalizations.submit));
            await tester.pumpAndSettle();
            expect(container.read(appSettingProvider).delayTestTimeout, 60000);
          });

          testWidgets('concurrency rejects values outside 1 to 50', (tester) async {
            final container = ProviderContainer();
            globalState.container = container;
            addTearDown(container.dispose);
            final hold = container.listen(appSettingProvider, (_, _) {});
            addTearDown(hold.close);
            await tester.pumpWidget(UncontrolledProviderScope(
              container: container,
              child: const TestApp(child: Scaffold(body: DelayTestConcurrencyItem())),
            ));
            await tester.pumpAndSettle();
            await tester.tap(find.text('40'));
            await tester.pumpAndSettle();
            final field = tester.widget<TextFormField>(find.byType(TextFormField).first);
            expect(field.validator!('0'), isNotNull);
            expect(field.validator!('51'), isNotNull);
            expect(field.validator!('1'), isNull);
            expect(field.validator!('50'), isNull);
            await tester.enterText(find.byType(TextFormField).first, '17');
            await tester.tap(find.text(currentAppLocalizations.submit));
            await tester.pumpAndSettle();
            expect(container.read(appSettingProvider).delayTestConcurrency, 17);
          });
        }
        ''')

        PY
    - name: 配置 Android 签名
      if: matrix.platform == 'android'
      shell: bash
      run: |
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
        {
          echo "keyAlias=$ANDROID_KEY_ALIAS"
          echo "storePassword=$ANDROID_STORE_PASSWORD"
          echo "keyPassword=$ANDROID_KEY_PASSWORD"
        } >> android/local.properties
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: core/go.sum
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.platform }}-${{ matrix.arch }}
        workspaces: |-
          services/helper
          plugins/rust_api/rust
        cache-directories: .dart_tool/hooks_runner
    - name: Setup Gradle
      if: matrix.platform == 'android'
      uses: gradle/actions/setup-gradle@v6
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - name: Setup Xcode
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_26.3.app || \
          sudo xcode-select -s /Applications/Xcode_26.2.app
        xcodebuild -version
    - name: Setup NDK
      if: matrix.platform == 'android'
      uses: nttld/setup-ndk@v1
      id: build-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
        link-to-sdk: true
    - name: Fetch CA certificates
      shell: bash
      env:
        CA_BUNDLE: cacert-2026-09-25.pem
        CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
      run: |
        bundle=core/Clash.Meta/component/ca/ca-certificates.crt
        curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
        echo "$CA_BUNDLE_SHA256  $bundle" | shasum -a 256 -c -
    - name: 获取 Flutter 依赖
      shell: bash
      run: |
        flutter --version
        flutter pub get
    - name: 生成本地化与模型代码
      shell: bash
      run: |
        cp pubspec.yaml "$RUNNER_TEMP/pubspec.codegen.yaml"
        trap 'cp "$RUNNER_TEMP/pubspec.codegen.yaml" pubspec.yaml' EXIT
        python3 - <<'PY'
        from pathlib import Path
        file = Path('pubspec.yaml')
        file.write_text(file.read_text().replace('build_assets: true', 'build_assets: false'))
        PY
        dart run intl_utils:generate
        dart run build_runner build --delete-conflicting-outputs
    - name: 格式化自定义 Dart 代码
      shell: bash
      run: |
        dart format \
          lib/common/constant.dart lib/common/task_pool.dart lib/core/interface.dart \
          lib/models/config.dart lib/models/clash_config.dart \
          lib/views/config/general.dart lib/providers/actions/proxies.dart \
          test/personal_build_test.dart
    - name: 验证自定义设置与调度兼容性
      shell: bash
      run: |
        flutter analyze --no-fatal-infos
        cp pubspec.yaml "$RUNNER_TEMP/pubspec.test.yaml"
        trap 'cp "$RUNNER_TEMP/pubspec.test.yaml" pubspec.yaml' EXIT
        python3 - <<'PY'
        from pathlib import Path
        file = Path('pubspec.yaml')
        source = file.read_text()
        old = '    setup:\n      build_assets: true'
        if source.count(old) != 1:
            raise SystemExit('Cannot disable the Go packaging hook for tests')
        file.write_text(source.replace(old, '    setup:\n      build_assets: false', 1))
        PY
        flutter test test/personal_build_test.dart test/common/task_pool_test.dart test/providers/proxies_action_test.dart test/core/protocol_contract_test.dart test/l10n test/lint/dynamic_message_key_test.dart
    - name: Build
      env:
        ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
      shell: bash
      run: |
        if [ "${{ matrix.platform }}" = "android" ]; then
          dart setup.dart android --arch arm64 --env stable -v
        else
          dart setup.dart macos --env stable -v
        fi
    - name: 上传安装包
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.platform }}-${{ matrix.arch }}
        path: ./dist
        overwrite: true
        if-no-files-found: error
        retention-days: 30
